    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 650; fill: #111827; }
      .cluster-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 650; fill: #374151; }
      .node-text { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; }
      .cluster { fill: #fdfefe; stroke: #d8dee6; stroke-width: 1.8; rx: 16; }
      .seed { fill: #fff0f1; stroke: #d98b95; stroke-width: 1.8; rx: 9; }
      .crawler { fill: #eef5ff; stroke: #78a7df; stroke-width: 1.8; rx: 9; }
      .api-list { fill: #fff8df; stroke: #d7b858; stroke-width: 1.8; rx: 9; }
      .api-detail { fill: #f3edff; stroke: #9274c7; stroke-width: 1.8; rx: 9; }
      .table-users { fill: #edf5ff; stroke: #3578c8; stroke-width: 1.8; rx: 9; }
      .table-user-following { fill: #f3edff; stroke: #7654ad; stroke-width: 1.8; rx: 9; }
      .table-orgs { fill: #fff3e5; stroke: #d9822b; stroke-width: 1.8; rx: 9; }
      .table-repos { fill: #e7f5ed; stroke: #32805a; stroke-width: 1.8; rx: 9; }
      .table-repo-star { fill: #e6fcfc; stroke: #0ca6a6; stroke-width: 1.8; rx: 9; }
      .request { fill: none; stroke: #dc3545; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .request-join { fill: none; stroke: #dc3545; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .write-users { fill: none; stroke: #3578c8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-users); }
      .write-user-following { fill: none; stroke: #7654ad; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-user-following); }
      .write-orgs { fill: none; stroke: #d9822b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orgs); }
      .write-repos { fill: none; stroke: #32805a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-repos); }
      .write-repos-join { fill: none; stroke: #32805a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .write-repo-star { fill: none; stroke: #0ca6a6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-repo-star); }
      .feed-users { fill: none; stroke: #3578c8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-users); }
      .feed-orgs { fill: none; stroke: #d9822b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orgs); }
      .flow-overlay { pointer-events: none; opacity: 0.6; }
      .flow-overlay path { marker-end: none; stroke-width: 4; stroke-dasharray: 10 18; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .flow-overlay { display: none; } }
