name: Pull Request CI

on:
  - push

jobs:
  prepare:
    name: Prepare image tags
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
    steps:
      - name: Set env
        id: vars
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

  image:
    name: Image builder (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Delete huge unnecessary folders, and clean apt cache
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          rm -rf /opt/hostedtoolcache
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.date }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=registry,force-compression=true,oci-mediatypes=true

  merge-multi-arch:
    name: Merge multi-arch image
    runs-on: ubuntu-24.04
    needs: [prepare, image]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.date }} \
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.date }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.date }}-arm64
